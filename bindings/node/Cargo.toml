[package]
name = "agent-receipts-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
agent-receipts = { path = "../../crates/core" }
napi = "=3.4.0"
napi-derive = "=3.3.0"
# 3.1.0 and later need rustc 1.88. napi 3.4.0 allows them.
napi-sys = "=3.0.1"
# 3.0.1 and later need rustc 1.88. napi-derive 3.3.0 allows them.
napi-derive-backend = "=3.0.0"
# 1.13 needs rustc 1.85. convert_case 0.8 allows it.
unicode-segmentation = "=1.12.0"

[build-dependencies]
napi-build = "=2.2.4"
