[package]
name = "agent-receipts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
stream = ["dep:tokio"]

[dependencies]
hmac = "=0.12.1"
ryu-js = "=1.0.3"
sha2 = "=0.10.8"
tokio = { workspace = true, optional = true, features = ["io-util", "sync", "macros", "rt"] }

[dev-dependencies]
base64 = "0.22"
sha2 = "=0.10.8"

[[test]]
name = "vectors"
harness = false
