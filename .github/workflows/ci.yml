name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 -m pip install maturin==1.16.0 pytest
      - run: maturin build --release --manifest-path bindings/python/Cargo.toml --interpreter python3
      - name: Install the abi3 wheel and run pytest
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find target/wheels -name '*cp39-abi3*.whl' -type f | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            printf 'expected exactly one cp39-abi3 wheel, found %s\n' "${#wheels[@]}" >&2
            printf '%s\n' "${wheels[@]}" >&2
            exit 1
          fi
          python3 -m pip install "${wheels[0]}"
          python3 -m pytest bindings/python/tests
      - name: Build and test the Node binding
        working-directory: bindings/node
        run: |
          npm ci
          npm run build
          npm test
